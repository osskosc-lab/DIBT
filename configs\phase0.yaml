simulation:
  steps: 2400
  burn_in: 200
  n_external: 3
  n_boundary: 2
  n_internal: 3
  process_noise: 0.08
  common_driver_strength: 0.85
  intervention_probability: 0.22
  train_intervention_amplitudes: [-1.0, -0.5, 0.5, 1.0]
  ood_intervention_amplitudes: [-2.0, -1.5, 1.5, 2.0]
  viability_radius: 2.5

estimation:
  ridge: 0.01
  permutation_repeats: 80
  permutation_quantile: 0.99
  min_intervention_samples: 20

experiment:
  seeds: 30
  bootstrap_repeats: 5000
  output_dir: "results/phase0"

decision:
  min_mean_delta_mcc: 0.05
  min_bootstrap_ci_lower: 0.0
  max_common_driver_edge_rate: 0.10
